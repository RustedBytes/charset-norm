[package]
name = "charset-norm"
version = "3.5.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Native core for the charset-norm Python package"
homepage = "https://github.com/RustedBytes/charset-norm"
repository = "https://github.com/RustedBytes/charset-norm"
documentation = "https://charset-normalizer.readthedocs.io/"
publish = false

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py38"] }
regex = "1.13"
rustc-hash = "2.1"
unicode-general-category = "1.1"
unicode-normalization = "0.1.25"
unicode_names2 = "4.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
