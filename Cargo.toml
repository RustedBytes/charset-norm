[workspace]
resolver = "3"
members = ["crates/charset-norm", "crates/charset-norm-python"]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
homepage = "https://github.com/RustedBytes/charset-norm"
repository = "https://github.com/RustedBytes/charset-norm"

[workspace.lints.rust]
unsafe_code = "forbid"
# docs.rs builds with `--cfg docsrs` to label feature-gated items.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Counts and lengths converted to f64 for ratios stay far below 2^52, where
# the conversion is exact.
cast_precision_loss = "allow"

# PyPy 3.12 changed its C-extension symbol mapping. Pin PyO3's upstream
# compatibility patch until it is included in a crates.io release.
# https://github.com/PyO3/pyo3/pull/6448
[patch.crates-io]
pyo3-build-config = { git = "https://github.com/PyO3/pyo3", rev = "dd54cd6e129439ab2c5d98ff11f06f1e0ea85cd6" }
pyo3-ffi = { git = "https://github.com/PyO3/pyo3", rev = "dd54cd6e129439ab2c5d98ff11f06f1e0ea85cd6" }

# Wheels are built with this profile: whole-program optimisation in a single
# codegen unit. Unwinding stays enabled so PyO3 can turn panics into exceptions.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
