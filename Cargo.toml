[workspace]
resolver = "2"
members = ["crates/charset-norm", "crates/charset-norm-python"]

[workspace.package]
version = "3.5.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
homepage = "https://github.com/RustedBytes/charset-norm"
repository = "https://github.com/RustedBytes/charset-norm"

[workspace.lints.rust]
unsafe_code = "forbid"

# Wheels are built with this profile: whole-program optimisation in a single
# codegen unit. Unwinding stays enabled so PyO3 can turn panics into exceptions.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
