[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "charset-normalizer"
description = "The Real First Universal Charset Detector. Open, modern and actively maintained alternative to Chardet."
license = {text = "MIT"}
readme = "README.md"
version = "3.5.1"
keywords = ["encoding", "charset", "charset-detector", "detector", "normalization", "unicode", "chardet", "detect"]
authors = [
  {name = "Ahmed R. TAHRI", email="tahri.ahmed@proton.me"},
]
maintainers = [
  {name = "Ahmed R. TAHRI", email="tahri.ahmed@proton.me"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 4 - Resilient",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
  "Typing :: Typed",
]
requires-python = ">=3.8"

[project.optional-dependencies]
unicode_backport = []

[dependency-groups]
ci = [
  "nox==2026.2.9; python_version == '3.8'",
  "nox>=2026.4.10; python_version >= '3.9'",
  "build==1.2.2.post1; python_version == '3.8'",
  "build==1.4.3; python_version >= '3.9'"
]
dev = [
  "pytest==8.3.5; python_version == '3.8'",
  "pytest==8.4.2; python_version == '3.9'",
  "pytest==9.0.3; python_version >= '3.10'",
  "coverage==7.6.1; python_version == '3.8'",
  "coverage==7.10.7; python_version == '3.9'",
  "coverage>=7.13.5; python_version >= '3.10'"
]

[tool.maturin]
bindings = "pyo3"
module-name = "charset_normalizer._native"
python-source = "src"
features = ["pyo3/abi3-py38"]
include = [
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
  "docs/**",
  "tests/**",
  "data/**",
]

[project.scripts]
normalizer = "charset_normalizer.cli:cli_detect"

[project.urls]
"Changelog" = "https://github.com/jawah/charset_normalizer/blob/master/CHANGELOG.md"
"Documentation" = "https://charset-normalizer.readthedocs.io/"
"Code" = "https://github.com/jawah/charset_normalizer"
"Issue tracker" = "https://github.com/jawah/charset_normalizer/issues"

[tool.pytest.ini_options]
log_level = "DEBUG"
filterwarnings = [
    "error",
]

[tool.isort]
profile = "black"
add_imports = "from __future__ import annotations"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false

[tool.codespell]
ignore-words-list = "Tham,Vai,intoto"
