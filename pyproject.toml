[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "charset-norm"
description = "The Real First Universal Charset Detector. Open, modern and actively maintained alternative to Chardet."
license = {text = "MIT"}
readme = "README.md"
version = "4.2.0"
keywords = ["encoding", "charset", "charset-detector", "detector", "normalization", "unicode", "chardet", "detect"]
authors = [
  {name = "Ahmed R. TAHRI", email="tahri.ahmed@proton.me"},
]
maintainers = [
  {name = "Ahmed R. TAHRI", email="tahri.ahmed@proton.me"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 4 - Resilient",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
  "Typing :: Typed",
]
requires-python = ">=3.9"

[project.optional-dependencies]
unicode_backport = []

[dependency-groups]
ci = [
  "nox>=2026.4.10",
  "build==1.4.3",
  "coverage[toml]==7.10.7; python_version == '3.9'",
  "coverage[toml]>=7.13.5; python_version >= '3.10'",
]
dev = [
  "pytest==8.4.2; python_version == '3.9'",
  "pytest==9.0.3; python_version >= '3.10'",
  "coverage[toml]==7.10.7; python_version == '3.9'",
  "coverage[toml]>=7.13.5; python_version >= '3.10'",
  "ruff==0.16.9",
  "pyright==1.1.414",
]

[tool.maturin]
manifest-path = "crates/charset-norm-python/Cargo.toml"
bindings = "pyo3"
module-name = "charset_norm._native"
python-source = "src"
features = ["pyo3/abi3-py39", "pyo3/abi3t-py315"]
include = [
  "CHANGELOG.md",
  "LICENSE",
  "tests/**",
  "data/**",
]

[project.scripts]
normalizer = "charset_norm.cli:cli_detect"

[project.urls]
"Changelog" = "https://github.com/RustedBytes/charset-norm/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/RustedBytes/charset-norm#readme"
"Code" = "https://github.com/RustedBytes/charset-norm"
"Issue tracker" = "https://github.com/RustedBytes/charset-norm/issues"

[tool.coverage.run]
source = ["charset_norm"]
# Needed for Python 3.11 and lower
disable_warnings = ["no-sysmon"]

[tool.coverage.paths]
source = [
  "src/charset_norm",
  "*/charset_norm",
  "*\\charset_norm",
]

[tool.coverage.report]
omit = ["src/charset_norm/__main__.py"]
exclude_lines = [
  "except ModuleNotFoundError:",
  "except ImportError:",
  "pass",
  "import",
  "raise NotImplementedError",
  ".* # Platform-specific.*",
  ".*:.* # Python \\d.*",
  ".* # Abstract",
  ".* # Defensive:",
  "if (?:typing.)?TYPE_CHECKING:",
  "^\\s*?\\.\\.\\.\\s*$",
]

[tool.pytest.ini_options]
log_level = "DEBUG"
filterwarnings = [
    "error",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["data"]

[tool.pyright]
include = ["src", "tests", "bin"]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# The comparison scripts need chardet, which is not a development dependency.
[[tool.pyright.executionEnvironments]]
root = "bin"
reportMissingImports = "warning"

[[tool.pyright.executionEnvironments]]
root = "."

[tool.isort]
profile = "black"
add_imports = "from __future__ import annotations"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false

[tool.codespell]
ignore-words-list = "Tham,Vai,intoto"
