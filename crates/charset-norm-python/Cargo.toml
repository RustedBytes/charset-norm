[package]
name = "charset-norm-python"
description = "PyO3 bindings exposing charset-norm as the charset_norm Python package"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
charset-norm = { path = "../charset-norm", version = "=4.1.0" }
mimalloc = { version = "0.1", default-features = false }
pyo3 = { version = "=0.29.2", features = ["abi3-py39", "abi3t-py315"] }

[lints]
workspace = true
