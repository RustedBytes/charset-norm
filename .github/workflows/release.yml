name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build abi3 wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: windows
            runner: windows-latest
            platform: windows
          - name: macos
            runner: macos-latest
            platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install zig (for Linux manylinux builds)
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build wheels (Linux)
        if: matrix.platform == 'linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          args: --release --locked --strip --out dist --zig --interpreter python3.10

      - name: Build wheels (Windows/macOS)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          args: --release --locked --strip --out dist

      - name: Verify wheels are abi3
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels were built in dist/" >&2
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            name="$(basename "$wheel")"
            if [[ "$name" != *-cp39-abi3-* ]]; then
              echo "Expected a cp39-abi3 wheel, got: $name" >&2
              exit 1
            fi
          done

      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -c "import charset_norm; assert charset_norm.__version__; text = '\u041f\u0440\u0438\u0432\u0456\u0442, \u0441\u0432\u0456\u0442! \u0426\u0435 \u0442\u0435\u0441\u0442\u043e\u0432\u0438\u0439 \u0442\u0435\u043a\u0441\u0442 \u0443\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u043e\u044e \u043c\u043e\u0432\u043e\u044e.'; assert str(charset_norm.from_bytes(text.encode('cp1251')).best()) == text"
          normalizer --version

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload sdist to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PyPy and Python 3.14t need interpreter-specific wheels; Python 3.15+
  # shares one abi3t wheel between GIL and free-threaded interpreters.
  build-interpreter-wheels:
    name: Build ${{ matrix.interpreter.tag }} wheel on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        interpreter:
          # Pin the PyPy release so 3.12 is downloaded even before runner caches update.
          - { python: 'pypy3.11-v8.0.0', tag: pp311, pypy: true }
          - { python: 'pypy3.12-v8.0.0', tag: pp312, pypy: true }
          - { python: '3.14t', tag: cp314t, pypy: false }
          - { python: '3.15t', tag: abi3t, pypy: false }
        target: [linux-x86_64, linux-arm64, windows, macos]
        include:
          - target: linux-x86_64
            name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            build-args: --release --locked --strip --out dist --interpreter python --zig --compatibility manylinux_2_28
          - target: linux-arm64
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            build-args: --release --locked --strip --out dist --interpreter python --zig --compatibility manylinux_2_28
          - target: windows
            name: windows
            runner: windows-latest
            platform: windows
            build-args: --release --locked --strip --out dist --interpreter python
          - target: macos
            name: macos
            runner: macos-latest
            platform: macos
            build-args: --release --locked --strip --out dist --interpreter python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.interpreter.python }}
          allow-prereleases: true

      - name: Install zig (for Linux manylinux builds)
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          # The manylinux images do not contain every interpreter, so use the
          # one installed above. Zig supplies the portable Linux ABI.
          container: off
          args: ${{ matrix.build-args }}

      - name: Verify wheel tag
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi

          expected_tag="${{ matrix.interpreter.tag }}"
          name="$(basename "${wheels[0]}")"
          if [[ "$expected_tag" == abi3t ]]; then
            expected_tag="cp315-abi3.abi3t"
          fi
          if [[ "$name" != *"-${expected_tag}-"* ]]; then
            echo "Expected a ${expected_tag} wheel, got: $name" >&2
            exit 1
          fi

      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv .smoke-interpreter
          if [ -f .smoke-interpreter/Scripts/python.exe ]; then
            smoke_python="$PWD/.smoke-interpreter/Scripts/python.exe"
          else
            smoke_python="$PWD/.smoke-interpreter/bin/python"
          fi
          "$smoke_python" -m pip install --no-deps dist/*.whl
          cd "$(mktemp -d)"
          "$smoke_python" -c "import platform, sys, sysconfig, charset_norm, charset_norm._native; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or not sys._is_gil_enabled(); assert (platform.python_implementation() == 'PyPy') == ${{ matrix.interpreter.pypy && 'True' || 'False' }}; assert charset_norm.__version__; text = '\u041f\u0440\u0438\u0432\u0456\u0442, \u0441\u0432\u0456\u0442! \u0426\u0435 \u0442\u0435\u0441\u0442\u043e\u0432\u0438\u0439 \u0442\u0435\u043a\u0441\u0442 \u0443\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u043e\u044e \u043c\u043e\u0432\u043e\u044e.'; match = charset_norm.from_bytes(text.encode('cp1251')).best(); assert str(match) == text; assert match.output('utf_8') == text.encode('utf_8')"

      - name: Set up GIL Python 3.15 for the same abi3t wheel
        if: matrix.interpreter.tag == 'abi3t'
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Smoke-test the same abi3t wheel on GIL Python
        if: matrix.interpreter.tag == 'abi3t'
        shell: bash
        run: |
          python -m venv .smoke-315
          if [ -f .smoke-315/Scripts/python.exe ]; then
            smoke_python="$PWD/.smoke-315/Scripts/python.exe"
          else
            smoke_python="$PWD/.smoke-315/bin/python"
          fi
          "$smoke_python" -m pip install --no-deps dist/*.whl
          cd "$(mktemp -d)"
          "$smoke_python" -c "import sysconfig, charset_norm, charset_norm._native; assert not sysconfig.get_config_var('Py_GIL_DISABLED'); text = 'Привіт, світе! Це тестовий текст українською мовою.'; match = charset_norm.from_bytes(text.encode('cp1251')).best(); assert str(match) == text; assert match.output('utf_8') == text.encode('utf_8')"

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.interpreter.tag }}-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-interpreter-wheels, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/charset-norm
    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'sdist'
          merge-multiple: true

      - name: Validate distributions
        run: |
          ls -lah dist/
          python - <<'PY'
          from pathlib import Path
          import struct
          import tarfile
          import zipfile
          from email.parser import Parser

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))

          if len(wheels) != 20:
              raise SystemExit(f"Expected 20 platform wheels, found {len(wheels)}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected 1 source distribution, found {len(sdists)}")

          for wheel in wheels:
              data = wheel.read_bytes()
              eocd = data.rfind(b"PK\x05\x06")
              if eocd < 0 or eocd + 22 > len(data):
                  raise SystemExit(f"{wheel}: missing or truncated ZIP end record")

              comment_length = struct.unpack_from("<H", data, eocd + 20)[0]
              archive_end = eocd + 22 + comment_length
              if comment_length:
                  raise SystemExit(f"{wheel}: ZIP comments are not accepted by PyPI")
              if archive_end != len(data):
                  trailing = len(data) - archive_end
                  raise SystemExit(f"{wheel}: contains {trailing} trailing bytes")

              with zipfile.ZipFile(wheel) as archive:
                  bad_member = archive.testzip()
                  if bad_member is not None:
                      raise SystemExit(f"{wheel}: corrupt member {bad_member}")

                  metadata_paths = [name for name in archive.namelist() if name.endswith(".dist-info/WHEEL")]
                  if len(metadata_paths) != 1:
                      raise SystemExit(f"{wheel}: expected exactly one WHEEL metadata file")
                  metadata = Parser().parsestr(archive.read(metadata_paths[0]).decode())
                  python_tag, abi_tag, platform_tag = wheel.stem.rsplit("-", 3)[1:]
                  filename_tags = {
                      f"{py}-{abi}-{platform}"
                      for py in python_tag.split(".")
                      for abi in abi_tag.split(".")
                      for platform in platform_tag.split(".")
                  }
                  if set(metadata.get_all("Tag", [])) != filename_tags:
                      raise SystemExit(f"{wheel}: filename and WHEEL tags disagree")

          with tarfile.open(sdists[0], mode="r:gz") as archive:
              archive.getmembers()

          expected = {"abi3": 4, "pp311": 4, "pp312": 4, "cp314t": 4, "cp315-abi3.abi3t": 4}
          for tag, count in expected.items():
              found = [wheel for wheel in wheels if f"-{tag}-" in wheel.name]
              if len(found) != count:
                  raise SystemExit(f"Expected {count} {tag} wheels, found {len(found)}")

          print(f"Validated {len(wheels)} wheels and {len(sdists)} source distribution")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
